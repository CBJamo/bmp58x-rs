[package]
name = "bmp58x-example"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.9", features = [
  "arch-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = [
  "defmt",
  "defmt-timestamp-uptime",
] }
embassy-sync = { version = "0.7", features = ["defmt"] }
embassy-rp = { version = "0.8", features = [
  "time-driver",
  "critical-section-impl",
  "rp235xa",
  "binary-info",
  "defmt",
] }

embedded-hal = "1"
embedded-hal-async = "1"
embassy-embedded-hal = { version = "0.5", features = ["defmt"] }

defmt = { version = "1" }
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"

bmp58x-rs = { path = "../../", features = ["defmt"] }

[profile.release]
# Enable generation of debug symbols even on release builds
debug = true
